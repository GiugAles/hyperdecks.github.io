<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Gill Sans Nova, Gill Sans MT, Gill Sans, Gillius ADF No2, Calibri, sans-serif" style="font-variant-ligatures:none"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#595959"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#00802F"/></marker></defs><rect x="20" y="5" width="212" height="70" rx="10" fill="#00802F"/><text x="126.0" y="40.0" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">WebID</text><rect x="20" y="75" width="212" height="110" fill="#fff" stroke="#00802F" stroke-width="2.5"/><text x="126" y="115" font-size="19" fill="#000" text-anchor="middle">…/profile/card#me</text><line x1="241" y1="130" x2="256" y2="130" stroke="#595959" stroke-width="3" marker-end="url(#a)"/><rect x="255" y="5" width="212" height="70" rx="10" fill="#7C4DFF"/><text x="361.0" y="40.0" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">Profile document</text><rect x="255" y="75" width="212" height="110" fill="#fff" stroke="#7C4DFF" stroke-width="2.5"/><text x="361" y="115" font-size="17" fill="#000" text-anchor="middle">solid:publicTypeIndex</text><line x1="476" y1="130" x2="491" y2="130" stroke="#595959" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="5" width="212" height="70" rx="10" fill="#7C4DFF"/><text x="596.0" y="40.0" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">Public type index</text><rect x="490" y="75" width="212" height="110" fill="#fff" stroke="#7C4DFF" stroke-width="2.5"/><text x="596" y="115" font-size="17" fill="#000" text-anchor="middle">solid:forClass pitas:Auction</text><text x="596" y="147" font-size="17" fill="#000" text-anchor="middle">solid:instanceContainer</text><line x1="711" y1="130" x2="726" y2="130" stroke="#595959" stroke-width="3" marker-end="url(#a)"/><rect x="725" y="5" width="212" height="70" rx="10" fill="#7C4DFF"/><text x="831.0" y="40.0" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">Container</text><rect x="725" y="75" width="212" height="110" fill="#fff" stroke="#7C4DFF" stroke-width="2.5"/><text x="831" y="115" font-size="19" fill="#000" text-anchor="middle">…/pitas/auctions/</text><text x="831" y="147" font-size="19" fill="#000" text-anchor="middle">ldp:contains</text><line x1="946" y1="130" x2="961" y2="130" stroke="#595959" stroke-width="3" marker-end="url(#a)"/><rect x="960" y="5" width="212" height="70" rx="10" fill="#7C4DFF"/><text x="1066.0" y="40.0" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">Auction</text><rect x="960" y="75" width="212" height="110" fill="#fff" stroke="#7C4DFF" stroke-width="2.5"/><text x="1066" y="115" font-size="19" fill="#000" text-anchor="middle">a-001.ttl</text><text x="20" y="250" font-size="22" fill="#595959" text-anchor="start">The bidder knows only the auction house's WebID. Each step is a GET and a link to follow:</text><text x="20" y="290" font-size="22" fill="#595959" text-anchor="start">no directory, no hard-coded container paths, no out-of-band agreement on URIs.</text><text x="20" y="350" font-size="22" fill="#00802F" text-anchor="start" font-weight="600">The only shared knowledge: HTTP, RDF, the Solid vocabulary and the class pitas:Auction.</text></svg>