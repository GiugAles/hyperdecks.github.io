<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Gill Sans Nova, Gill Sans MT, Gill Sans, Gillius ADF No2, Calibri, sans-serif" style="font-variant-ligatures:none"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#595959"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#00802F"/></marker></defs><rect x="10" y="10" width="760" height="600" rx="14" fill="#f4f4f4"/><text x="30" y="45" font-size="21" fill="#595959" text-anchor="start" font-weight="600">Course server: solid.interactions.ics.unisg.ch</text><rect x="800" y="10" width="390" height="600" rx="14" fill="#f4f4f4"/><text x="820" y="45" font-size="21" fill="#595959" text-anchor="start" font-weight="600">A group's own server (CSS on its VM)</text><rect x="30" y="70" width="340" height="250" rx="12" fill="#fff" stroke="#7C4DFF" stroke-width="3"/><polygon points="77.0,102.0 68.5,116.7 51.5,116.7 43.0,102.0 51.5,87.3 68.5,87.3" fill="#7C4DFF"/><text x="86" y="110" font-size="22" fill="#000" text-anchor="start" font-weight="600">Client</text><rect x="48" y="134" width="304" height="42" rx="6" fill="#efe9ff"/><text x="62" y="162" font-size="19" fill="#000" text-anchor="start">tasks/t-17.ttl (task input)</text><rect x="48" y="186" width="304" height="42" rx="6" fill="#efe9ff"/><text x="62" y="214" font-size="19" fill="#000" text-anchor="start">results/r-17.ttl</text><rect x="48" y="238" width="304" height="42" rx="6" fill="#e6f2ea"/><text x="62" y="266" font-size="19" fill="#000" text-anchor="start">WebID …/client/card#me</text><rect x="410" y="70" width="340" height="250" rx="12" fill="#fff" stroke="#7C4DFF" stroke-width="3"/><polygon points="457.0,102.0 448.5,116.7 431.5,116.7 423.0,102.0 431.5,87.3 448.5,87.3" fill="#7C4DFF"/><text x="466" y="110" font-size="22" fill="#000" text-anchor="start" font-weight="600">Auction house</text><rect x="428" y="134" width="304" height="42" rx="6" fill="#efe9ff"/><text x="442" y="162" font-size="19" fill="#000" text-anchor="start">workers/: WebIDs only</text><rect x="428" y="186" width="304" height="42" rx="6" fill="#fde2e2"/><text x="442" y="214" font-size="19" fill="#000" text-anchor="start">auctions, bids, awards ?</text><rect x="428" y="238" width="304" height="42" rx="6" fill="#e6f2ea"/><text x="442" y="266" font-size="19" fill="#000" text-anchor="start">WebID …/house/card#me</text><rect x="820" y="70" width="350" height="250" rx="12" fill="#fff" stroke="#7C4DFF" stroke-width="3"/><polygon points="867.0,102.0 858.5,116.7 841.5,116.7 833.0,102.0 841.5,87.3 858.5,87.3" fill="#7C4DFF"/><text x="876" y="110" font-size="22" fill="#000" text-anchor="start" font-weight="600">Worker</text><rect x="838" y="134" width="314" height="42" rx="6" fill="#efe9ff"/><text x="852" y="162" font-size="19" fill="#000" text-anchor="start">details.ttl (task types)</text><rect x="838" y="186" width="314" height="42" rx="6" fill="#fde2e2"/><text x="852" y="214" font-size="19" fill="#000" text-anchor="start">bids ?</text><rect x="838" y="238" width="314" height="42" rx="6" fill="#e6f2ea"/><text x="852" y="266" font-size="19" fill="#000" text-anchor="start">WebID …/worker/card#me</text><line x1="735" y1="155" x2="835" y2="155" stroke="#00802F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#g)"/><text x="785" y="124" font-size="15" fill="#00802F" text-anchor="middle"><tspan x="785">worker details</tspan><tspan x="785" dy="18">stay with worker</tspan></text><path d="M995,322 V372 H200 V324" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="395" font-size="17" fill="#595959" text-anchor="middle">Task data stays with the client: the worker reads the input, writes the result, and keeps no copy</text><rect x="30" y="420" width="720" height="170" rx="10" fill="#fff" stroke="#00802F" stroke-width="2.5"/><rect x="50" y="440" width="26" height="26" rx="4" fill="#7C4DFF"/><text x="92" y="461" font-size="20" fill="#000" text-anchor="start">Pod of one entity: only that entity sets the access rules</text><rect x="50" y="490" width="26" height="26" rx="4" fill="#00802F"/><text x="92" y="511" font-size="20" fill="#000" text-anchor="start">Dashed green: resolved by URI at run time, no copy</text><rect x="50" y="540" width="26" height="26" rx="4" fill="#EB6969"/><text x="92" y="561" font-size="20" fill="#000" text-anchor="start">Red: your group decides who owns it (Task 1)</text><rect x="820" y="420" width="350" height="170" rx="10" fill="#fff" stroke="#595959" stroke-width="2.5"/><text x="995.0" y="467.2" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">Pods may live on</text><text x="995.0" y="492.4" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">different servers:</text><text x="995.0" y="517.6" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">the ecosystem must</text><text x="995.0" y="542.8" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">not care</text></svg>
