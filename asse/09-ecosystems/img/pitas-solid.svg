or="start">auctions/a-001.ttl</text><rect x="428" y="186" width="304" height="42" rx="6" fill="#efe9ff"/><text x="442" y="214" font-size="19" fill="#000" text-anchor="start">auctions/a-001/bids/</text><rect x="428" y="238" width="304" height="42" rx="6" fill="#e6f2ea"/><text x="442" y="266" font-size="19" fill="#000" text-anchor="start">WebID …/house/card#me</text><rect x="820" y="70" width="350" height="250" rx="12" fill="#fff" stroke="#7C4DFF" stroke-width="3"/><polygon points="867.0,102.0 858.5,116.7 841.5,116.7 833.0,102.0 841.5,87.3 858.5,87.3" fill="#7C4DFF"/><text x="876" y="110" font-size="22" fill="#000" text-anchor="start" font-weight="600">Bidder and worker</text><rect x="838" y="134" width="314" height="42" rx="6" fill="#fde2e2"/><text x="852" y="162" font-size="19" fill="#000" text-anchor="start">bids/b-8f2c.ttl ?</text><rect x="838" y="186" width="314" height="42" rx="6" fill="#efe9ff"/><text x="852" y="214" font-size="19" fill="#000" text-anchor="start">results/r-17.ttl</text><rect x="838" y="238" width="314" height="42" rx="6" fill="#e6f2ea"/><text x="852" y="266" font-size="19" fill="#000" text-anchor="start">WebID …/worker/card#me</text><line x1="428" y1="155" x2="352" y2="155" stroke="#00802F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#g)"/><text x="390" y="135" font-size="17" fill="#00802F" text-anchor="middle">links to</text><line x1="838" y1="205" x2="735" y2="205" stroke="#EB6969" stroke-width="2.5" marker-end="url(#a)"/><text x="786" y="192" font-size="17" fill="#EB6969" text-anchor="middle">append?</text><path d="M995,336 V395 H200 V318" fill="none" stroke="#00802F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#g)"/><text x="600" y="385" font-size="17" fill="#00802F" text-anchor="middle">the result links to the task</text><rect x="30" y="420" width="720" height="170" rx="10" fill="#fff" stroke="#00802F" stroke-width="2.5"/><text x="390.0" y="505.0" font-size="24" fill="#000" text-anchor="middle" dominant-baseline="middle"></text><rect x="50" y="440" width="26" height="26" rx="4" fill="#7C4DFF"/><text x="92" y="461" font-size="20" fill="#000" text-anchor="start">Pod of one entity: only that entity sets the access rules</text><rect x="50" y="490" width="26" height="26" rx="4" fill="#00802F"/><text x="92" y="511" font-size="20" fill="#000" text-anchor="start">Dashed green: a link by URI, no copy</text><rect x="50" y="540" width="26" height="26" rx="4" fill="#EB6969"/><text x="92" y="561" font-size="20" fill="#000" text-anchor="start">Red: open question for Task 1, e.g. where is a bid stored?</text><rect x="820" y="420" width="350" height="170" rx="10" fill="#fff" stroke="#595959" stroke-width="2.5"/><text x="995.0" y="467.2" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">Pods may live on</text><text x="995.0" y="492.4" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">different servers:</text><text x="995.0" y="517.6" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">the ecosystem must</text><text x="995.0" y="542.8" font-size="21" fill="#595959" text-anchor="middle" dominant-baseline="middle">not care</text></svg>