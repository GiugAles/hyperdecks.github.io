<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Gill Sans Nova, Gill Sans MT, Gill Sans, Gillius ADF No2, Calibri, sans-serif" style="font-variant-ligatures:none"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#595959"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#00802F"/></marker></defs><rect x="15" y="10" width="270" height="64" rx="10" fill="#00802F"/><text x="150.0" y="42.0" font-size="23" fill="#fff" text-anchor="middle" dominant-baseline="middle">PITAS app</text><line x1="150" y1="74" x2="150" y2="590" stroke="#00802F" stroke-width="2" stroke-dasharray="4 6"/><rect x="315" y="10" width="270" height="64" rx="10" fill="#73A5AF"/><text x="450.0" y="42.0" font-size="23" fill="#fff" text-anchor="middle" dominant-baseline="middle">Identity provider</text><line x1="450" y1="74" x2="450" y2="590" stroke="#73A5AF" stroke-width="2" stroke-dasharray="4 6"/><rect x="615" y="10" width="270" height="64" rx="10" fill="#7C4DFF"/><text x="750.0" y="42.0" font-size="23" fill="#fff" text-anchor="middle" dominant-baseline="middle">Pod (resource server)</text><line x1="750" y1="74" x2="750" y2="590" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="4 6"/><rect x="915" y="10" width="270" height="64" rx="10" fill="#595959"/><text x="1050.0" y="42.0" font-size="23" fill="#fff" text-anchor="middle" dominant-baseline="middle">WebID profile</text><line x1="1050" y1="74" x2="1050" y2="590" stroke="#595959" stroke-width="2" stroke-dasharray="4 6"/><line x1="150" y1="125" x2="442" y2="125" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="300.0" y="113" font-size="19" fill="#000" text-anchor="middle">1  log in as …/card#me (password or client credentials)</text><line x1="450" y1="200" x2="158" y2="200" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="300.0" y="188" font-size="19" fill="#000" text-anchor="middle">2  token that names the WebID, bound to the app's key (DPoP)</text><line x1="150" y1="275" x2="742" y2="275" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="450.0" y="263" font-size="19" fill="#000" text-anchor="middle">3  GET …/a-001/bids/   Authorization: DPoP &lt;token&gt;   + DPoP proof</text><line x1="750" y1="350" x2="1042" y2="350" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="900.0" y="338" font-size="19" fill="#000" text-anchor="middle">4  dereference the WebID: is this issuer listed?</text><line x1="1050" y1="410" x2="758" y2="410" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="900.0" y="398" font-size="19" fill="#000" text-anchor="middle">solid:oidcIssuer &lt;https://idp…&gt;</text><line x1="750" y1="545" x2="158" y2="545" stroke="#595959" stroke-width="2.5" marker-end="url(#a)"/><text x="450.0" y="533" font-size="19" fill="#000" text-anchor="middle">6  200 OK, 401 Unauthorized or 403 Forbidden</text><rect x="620" y="445" width="260" height="56" rx="10" fill="#efe9ff"/><text x="750.0" y="473.0" font-size="20" fill="#000" text-anchor="middle" dominant-baseline="middle">5  check the access rules</text></svg>